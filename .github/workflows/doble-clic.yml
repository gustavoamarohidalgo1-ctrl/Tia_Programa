name: Doble clic como en casa

# Reproduce a la persona que recibe el instalador por WhatsApp y lo abre con doble clic, en una Windows con el
# antivirus en la nube y SmartScreen encendidos, como una computadora de casa. Compara el instalador nuevo con
# el 1.7.1 (con el que «no aparecía nada»). El 1.6.3 (que sí se instaló) se comparó una vez desde un borrador
# privado ya eliminado: los tres abrían igual tras el aviso de SmartScreen.
on:
  push:
    paths:
      - 'instaladores/**'
      - '.github/windows/**'
      - '.github/workflows/doble-clic.yml'
  workflow_dispatch:

concurrency:
  group: doble-clic-${{ github.sha }}
  cancel-in-progress: true

jobs:
  doble-clic:
    name: ${{ matrix.instalador }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        instalador: [nuevo, v1.7.1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar el instalador a probar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $destino = Join-Path $env:RUNNER_TEMP 'probar.exe'
          switch ('${{ matrix.instalador }}') {
            'nuevo'  { Copy-Item instaladores/Agencia-de-Empleos-Windows-x64.exe $destino }
            'v1.7.1' { cmd /c "git cat-file blob 652aa47:instaladores/Agencia-de-Empleos-Windows-x64.exe > `"$destino`"" }
          }
          Get-FileHash $destino | Format-List | Out-String | Write-Host
          if ((Get-Item $destino).Length -lt 1000000) { throw 'No se obtuvo el instalador' }
      - name: Computadora como en casa (antivirus en la nube y SmartScreen)
        shell: pwsh
        run: ./.github/windows/como_equipo_de_casa.ps1
      - name: Recibido por WhatsApp y abierto con doble clic
        shell: pwsh
        run: ./.github/windows/doble_clic_descargado.ps1 -Instalador "$env:RUNNER_TEMP\probar.exe" -Nombre "Agencia-${{ matrix.instalador }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doble-clic-${{ matrix.instalador }}-${{ matrix.os }}
          path: ${{ runner.temp }}/resultados
          if-no-files-found: ignore
